[project]
name = "earthburns"
version = "0.1.0"
description = "Data pipeline for the Earth Burns dataviz: observed vs counterfactual fire weather, 1979-2024"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "xarray>=2025.1",
  "netCDF4>=1.7",
  "h5py>=3.12",
  "requests>=2.32",
  "pandas>=2.2",
  "pyarrow>=18",
  "brotli>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9", "matplotlib>=3.9"]

[project.scripts]
earthburns = "earthburns.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earthburns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
